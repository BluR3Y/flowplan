[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeplan"
version = "0.1.0"
description = "A robust, modular Batch Pipeline library"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "rapidfuzz>=3.0.0",
    "openpyxl>=3.1.0",
    "jsonschema>=4.0.0",
    "xlsxwriter>=3.0.0"
]

[project.optional-dependencies]
access = ["pyodbc"]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0"
]

[project.scripts]
etl-run = "pipeplan.cli:main"

